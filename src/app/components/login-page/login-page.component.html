  <div class="login-shell">
    <section class="brand-panel"><img [src]="logo" class="brand-logo"><h1>WELCOME TO RENGAS</h1><p>TRADING & MANUFACTURING ADMIN SYSTEM</p></section>
    <section class="login-card"><p class="login-help">SELECT LOGIN TYPE AND ENTER CREDENTIALS</p>
      <div class="login-role-grid"><button [class.active]="role==='Admin'" (click)="setRole('Admin')">ADMIN</button><button [class.active]="role==='Order Management Admin'" (click)="setRole('Order Management Admin')">ORDER MANAGEMENT ADMIN</button></div>
      <div class="credential-box"><label>Username</label><input [(ngModel)]="username" placeholder="Enter username"><label>Password</label><input [(ngModel)]="password" type="password" placeholder="Enter password"><div *ngIf="error" class="login-error">{{error}}</div><button class="login-submit" (click)="login()">Login</button><small>Admin: admin / admin123 &nbsp; | &nbsp; Order: order / order123</small></div>
    </section>
  </div>
