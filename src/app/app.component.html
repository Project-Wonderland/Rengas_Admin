<div *ngIf="!loggedIn()" [ngClass]="role === 'Admin' ? 'admin-login' : 'order-login'" class="login-page" app-login-page [logo]="logo" [(role)]="role" (loginSuccess)="handleLoginSuccess($event)"></div>
<div *ngIf="loggedIn() === 'Admin'" class="app" app-admin-dashboard [logo]="logo" [loggedIn]="loggedIn()" [categories]="categories" [toast]="toast" (logout)="logout()" (openAddProduct)="openAddProduct()" (openEditProduct)="openEditProduct($event)" (deleteProduct)="deleteProduct($event)" (openAddCustomer)="openAddCustomer()"></div>
<div *ngIf="loggedIn() === 'Order Management Admin'" class="order-app" app-order-management [logo]="logo" [loggedIn]="loggedIn()" (logout)="logout()"></div>

<div *ngIf="modal==='product'" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><div><h3>{{editProduct.id ? 'Edit' : 'Add'}} Product</h3><p>Editable Angular form</p></div><button class="close" (click)="modal=null">×</button></div><div class="modal-body"><div class="image-picker"><img [src]="editProduct.image || logo"><b>Product Image URL</b><input [(ngModel)]="editProduct.image" placeholder="Image URL"></div><div class="form-grid"><label>SKU</label><input [(ngModel)]="editProduct.sku"><label>Name</label><input [(ngModel)]="editProduct.name"><label>Category</label><select [(ngModel)]="editProduct.category"><option *ngFor="let c of categories.slice(1)" [value]="c">{{c}}</option></select><label>UOM</label><select [(ngModel)]="editProduct.uom"><option *ngFor="let u of uoms" [value]="u">{{u}}</option></select><label>Price</label><input [(ngModel)]="editProduct.price"><button class="primary-full" (click)="saveProduct()">Save Product</button></div></div></div></div>
<div *ngIf="modal==='customer'" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><div><h3>Add Customer</h3><p>Customer details</p></div><button class="close" (click)="modal=null">×</button></div><div class="modal-body"><div></div><div class="form-grid"><label>Name</label><input [(ngModel)]="editCustomer.name"><label>Phone</label><input [(ngModel)]="editCustomer.phone"><label>WhatsApp</label><input [(ngModel)]="editCustomer.whatsapp"><label>TIN</label><input [(ngModel)]="editCustomer.tin"><label>Address</label><input [(ngModel)]="editCustomer.address"><button class="primary-full" (click)="saveCustomer()">Save Customer</button></div></div></div></div>
