<div *ngIf="!loggedIn()" [ngClass]="role === 'Admin' ? 'admin-login' : 'order-login'" class="login-page" app-login-page [logo]="logo" [(role)]="role" (loginSuccess)="handleLoginSuccess($event)"></div>
<div *ngIf="loggedIn() === 'Admin'" class="app" app-admin-dashboard [logo]="logo" [loggedIn]="loggedIn()" [categories]="categories" [toast]="toast" (logout)="logout()" (openAddProduct)="openAddProduct()" (openEditProduct)="openEditProduct($event)" (deleteProduct)="deleteProduct($event)" (openAddCustomer)="openAddCustomer()" (openDesignCMS)="modal='design'"></div>
<app-design-cms-modal *ngIf="modal==='design'" (close)="modal=null"></app-design-cms-modal>
<div *ngIf="loggedIn() === 'Order Management Admin'" class="order-app" app-order-management [logo]="logo" [loggedIn]="loggedIn()" (logout)="logout()"></div>

<div *ngIf="modal==='product'" class="modal-backdrop">
  <div class="modal-card large">
    <div class="modal-head">
      <div>
        <h3>Add Product / Category</h3>
        <p>Product details, bulk upload, and category management in one place.</p>
      </div>
      <button class="close" (click)="modal=null">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <div class="dual-body">
      <!-- Column 1: Product Details -->
      <div class="modal-column">
        <h4>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          Product Details
        </h4>
        
        <div class="image-picker" style="padding: 12px;">
          <div style="display:flex; align-items:center; gap: 14px; text-align:left;">
            <img [src]="editProduct.image || logo" style="width:84px; height:84px; border-radius:12px; object-fit:cover; border:1px solid #EAECF0;">
            <div>
              <b style="color:#101828; font-size:14px; font-weight:650;">Product Image</b>
              <span style="display:block; font-size:12px; color:#667085; margin:4px 0 10px;">Optional. Product can be saved without image.</span>
              <label class="upload-image" style="display:inline-flex; padding:0 16px; width:auto; font-size:12px; height:36px; border-radius:10px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Upload Image
                <input type="file" (change)="onImageUpload($event)">
              </label>
            </div>
          </div>
        </div>
        
        <div class="form-grid" style="margin-top: 18px; row-gap: 16px;">
          <label style="align-self:center;">Code</label>
          <input [(ngModel)]="editProduct.sku" placeholder="RG0001">
          
          <label style="align-self:center;">Description</label>
          <input [(ngModel)]="editProduct.name" placeholder="Description">
          
          <label style="align-self:center;">Category</label>
          <select [(ngModel)]="editProduct.category">
            <option *ngFor="let c of categories.slice(1)" [value]="c">{{c}}</option>
          </select>
          
          <label style="align-self:center;">UOM</label>
          <select [(ngModel)]="editProduct.uom">
            <option *ngFor="let u of uoms" [value]="u">{{u}}</option>
          </select>
          
          <label style="align-self:center;">Price</label>
          <input [(ngModel)]="editProduct.price" placeholder="RM 0.00">
        </div>
        
        <button class="primary-full" style="margin-top: 24px; border-radius:12px;" (click)="saveProduct()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          Save Product
        </button>
      </div>

      <!-- Column 2: Bulk Upload -->
      <div class="modal-column bulk-column" style="display:flex; flex-direction:column;">
        <h4>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Bulk Upload
        </h4>
        
        <label class="bulk-big-zone" style="min-height: 140px; border-radius:16px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:4px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          <b>Choose Excel / CSV</b>
          <small style="margin-top:4px;">{{selectedFileName || 'No file selected'}}</small>
          <input type="file" (change)="onFileUpload($event)" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel">
        </label>
        
        <button class="primary-full" style="background:#7A5AF8; border-radius:12px; margin-top:14px; box-shadow:0 10px 25px rgba(122,90,248,0.25);" (click)="uploadBulk()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Upload
        </button>
        
        <div style="text-align:center; margin-top:16px;">
          <span style="font-size:11px; color:#667085;">Format: Code, Description, Category, UOM, Price, Image</span>
        </div>
        
        <div style="margin-top:auto; padding-top:24px;">
          <button class="danger" style="width:100%; justify-content:center; background:#fff; color:#D92D20; border:1px solid #FDA29B; border-radius:12px; box-shadow:0 2px 4px rgba(217,45,32,0.05);" (click)="removeAllProducts()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            Remove All Products
          </button>
        </div>
      </div>

      <!-- Column 3: Category Management -->
      <div class="modal-column cat-col" style="display:flex; flex-direction:column;">
        <h4>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
          Category Management
        </h4>
        
        <div style="display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:end;">
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-size:12px; color:#344054;">Category Name</label>
            <input class="search-input" [(ngModel)]="newCategory" placeholder="Enter category name" style="height:42px; border-radius:10px; background:#fff;">
          </div>
          <button class="primary-small" style="height:42px; border-radius:10px; padding:0 18px;" (click)="addCategory()">+ Add</button>
        </div>
        
        <div style="margin-top:16px;">
          <label style="font-size:12px; color:#344054; margin-bottom:6px; display:block;">Search Category</label>
          <div class="search-input" style="height:42px; border-radius:10px; background:#fff;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input [(ngModel)]="catSearch" placeholder="Search category">
          </div>
        </div>
        
        <div style="display:flex; gap:10px; margin:16px 0 12px;">
          <button class="secondary" style="border-radius:99px; height:32px; font-size:12px; padding:0 14px; color:#09089C; background:#EEF0FF; border:none; box-shadow:none; font-weight:600;" (click)="toggleSelectAllCats()">Select / Clear All</button>
          <button class="danger" style="border-radius:99px; height:32px; font-size:12px; padding:0 14px; background:#FEF3F2; color:#D92D20; border:none; font-weight:600;" (click)="deleteSelectedCats()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            Delete Selected ({{selectedCats.length}})
          </button>
        </div>
        
        <div class="modal-cat-list" style="flex:1; background:transparent; padding:0; border:none;">
          <div class="modal-cat-item" *ngFor="let c of filteredCats()" style="background:#fff; border-radius:12px; padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; border:1px solid #EAECF0;">
            <label style="display:flex; align-items:center; gap:10px; cursor:pointer; width:100%; margin:0; font-size:13px; font-weight:500; color:#101828;">
              <input type="checkbox" [checked]="selectedCats.includes(c)" (change)="toggleCatSelect(c)" style="width:16px; height:16px; accent-color:#09089C;">
              {{c}}
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div *ngIf="modal==='customer'" class="modal-backdrop"><div class="modal-card"><div class="modal-head"><div><h3>Add Customer</h3><p>Customer details</p></div><button class="close" (click)="modal=null">×</button></div><div class="modal-body"><div></div><div class="form-grid"><label>Name</label><input [(ngModel)]="editCustomer.name"><label>Phone</label><input [(ngModel)]="editCustomer.phone"><label>WhatsApp</label><input [(ngModel)]="editCustomer.whatsapp"><label>TIN</label><input [(ngModel)]="editCustomer.tin"><label>Address</label><input [(ngModel)]="editCustomer.address"><button class="primary-full" (click)="saveCustomer()">Save Customer</button></div></div></div></div>

<app-confirmation-modal *ngIf="confirmConfig.visible" [title]="confirmConfig.title" [message]="confirmConfig.message" [isDanger]="confirmConfig.isDanger" (confirmed)="handleConfirm()" (cancelled)="confirmConfig.visible = false"></app-confirmation-modal>
